<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2b4d"/>
      <stop offset="1" stop-color="#06122a"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#2196f3"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 月亮光晕 -->
  <circle cx="362" cy="158" r="110" fill="url(#moonGlow)"/>
  <!-- 弯月（开口向左，象征涨潮上溯） -->
  <path d="M362 96 A62 62 0 1 0 362 220 A48 48 0 1 1 362 96 Z" fill="#ffe08a"/>
  <!-- 星点 -->
  <circle cx="150" cy="120" r="4" fill="#cfeefd" opacity="0.7"/>
  <circle cx="210" cy="90" r="3" fill="#cfeefd" opacity="0.5"/>
  <circle cx="270" cy="130" r="3.5" fill="#cfeefd" opacity="0.6"/>

  <!-- 潮汐波浪（三层） -->
  <path d="M0 300 Q64 250 128 300 T256 300 T384 300 T512 300 L512 512 L0 512 Z" fill="url(#w1)" opacity="0.95"/>
  <path d="M0 350 Q64 312 128 350 T256 350 T384 350 T512 350 L512 512 L0 512 Z" fill="#1976d2" opacity="0.7"/>
  <path d="M0 405 Q64 378 128 405 T256 405 T384 405 T512 405 L512 512 L0 512 Z" fill="#0d47a1" opacity="0.6"/>
</svg>
